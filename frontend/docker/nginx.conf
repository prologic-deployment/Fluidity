# ARCH-003 — nginx du SPA Fluidity.
# - SPA : toute route inconnue renvoie index.html (routeur Angular).
# - /api et /uploads sont relayés vers le service api du compose.
# - En-têtes de sécurité de base au niveau du frontal.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relais vers l'API (même origine pour le client → CORS simple).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache long pour les assets hashés ; HTML toujours frais.
    location ~* \.(js|css|woff2|png|jpg|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
