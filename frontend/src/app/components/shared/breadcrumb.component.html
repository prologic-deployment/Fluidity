<nav class="flex min-w-0 items-center gap-1 text-sm text-muted-foreground" aria-label="Fil d'ariane">
  <ng-container *ngFor="let crumb of crumbs; let last = last">
    <svg *ngIf="!last" class="hidden sm:block h-3.5 w-3.5 shrink-0 text-border" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>

    <a *ngIf="!last && crumb.path"
       [routerLink]="crumb.path"
       class="flex min-w-0 items-center gap-1.5 rounded-md px-1.5 py-1 transition-colors hover:bg-accent hover:text-foreground">
      <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <ng-container [ngSwitch]="crumb.icon">
          <ng-container *ngSwitchCase="'home'"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></ng-container>
          <ng-container *ngSwitchCase="'tickets'"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></ng-container>
          <ng-container *ngSwitchCase="'requests'"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></ng-container>
          <ng-container *ngSwitchCase="'changes'"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></ng-container>
          <ng-container *ngSwitchCase="'contracts'"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></ng-container>
          <ng-container *ngSwitchCase="'clients'"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></ng-container>
          <ng-container *ngSwitchCase="'profile'"><circle cx="12" cy="7" r="4"></circle><path d="M4 21v-1a7 7 0 0 1 14 0v1"></path></ng-container>
          <ng-container *ngSwitchCase="'security'"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></ng-container>
          <ng-container *ngSwitchCase="'plus'"><path d="M12 5v14M5 12h14"></path></ng-container>
          <ng-container *ngSwitchDefault><circle cx="12" cy="12" r="10"></circle></ng-container>
        </ng-container>
      </svg>
      <span class="truncate">{{ crumb.label }}</span>
    </a>

    <span *ngIf="!last && !crumb.path" class="flex min-w-0 items-center gap-1.5 truncate px-1.5 py-1">
      <span class="truncate">{{ crumb.label }}</span>
    </span>

    <span *ngIf="last" class="flex min-w-0 items-center gap-1.5 px-1.5 py-1 font-medium text-foreground">
      <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
      </svg>
      <span class="truncate">{{ crumb.label }}</span>
    </span>
  </ng-container>
</nav>
