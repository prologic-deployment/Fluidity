<!-- Fil d'Ariane : [🏠] › Étapes intermédiaires › Étape courante -->
<nav [attr.aria-label]="'nav.home' | t" class="hidden min-w-0 items-center sm:flex">
  <ol class="flex min-w-0 items-center gap-1.5 text-sm" *ngIf="items$ | async as items">
    <!-- Racine : tableau de bord -->
    <li class="flex shrink-0 items-center">
      <a
        [routerLink]="homeLink"
        [title]="homeLabel | t"
        class="flex h-6 w-6 items-center justify-center rounded-md text-muted-foreground transition-colors hover:bg-accent hover:text-foreground"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12l9-8 9 8"></path>
          <path d="M9 21V12h6v9"></path>
          <path d="M5 10v10h14V10"></path>
        </svg>
        <span class="sr-only">{{ homeLabel | t }}</span>
      </a>
    </li>

    <ng-container *ngFor="let item of items; let last = last">
      <!-- Étapes intermédiaires : masquées sous md quand le chemin est long -->
      <li class="min-w-0 items-center gap-1.5" [ngClass]="last || items.length <= 2 ? 'flex' : 'hidden md:flex'">
        <svg class="h-3.5 w-3.5 shrink-0 text-muted-foreground/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        <a
          *ngIf="!last; else etapeCourante"
          [routerLink]="item.url"
          class="max-w-[130px] truncate text-muted-foreground transition-colors hover:text-foreground"
          [title]="item.label"
        >{{ item.label }}</a>
        <ng-template #etapeCourante>
          <span aria-current="page" class="max-w-[180px] truncate font-medium text-foreground" [title]="item.label">
            {{ item.label }}
          </span>
        </ng-template>
      </li>
    </ng-container>
  </ol>
</nav>
