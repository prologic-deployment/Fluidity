<app-modal [open]="open" [title]="titre" [subtitle]="sousTitre" (closed)="fermer()">
  <div class="space-y-5">
    <!-- Avertissement : le provisoire n'est jamais relisible après fermeture -->
    <div class="rounded-md border border-amber-500/40 bg-amber-500/10 px-4 py-3 flex gap-3">
      <svg class="h-5 w-5 shrink-0 text-amber-600 dark:text-amber-400 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <path d="M12 9v4"></path>
        <path d="M12 17h.01"></path>
      </svg>
      <div class="text-sm">
        <p class="font-medium text-amber-700 dark:text-amber-400">Ces identifiants ne seront affichés qu'une seule fois.</p>
        <p class="mt-1 text-amber-700/80 dark:text-amber-400/80">
          Copiez-les et transmettez-les au client maintenant. Il devra remplacer
          ce mot de passe provisoire dès sa première connexion.
        </p>
      </div>
    </div>

    <!-- Identifiant (email de la fiche cliente) -->
    <div>
      <p class="field-label">Identifiant</p>
      <div class="flex items-center gap-2">
        <code class="flex-1 rounded-md border border-border bg-muted px-3 py-2 text-sm font-mono break-all">{{ email }}</code>
        <button type="button" class="btn-outline btn-sm shrink-0" (click)="copier(email, 'email')">
          {{ copieEmail ? 'Copié ✓' : 'Copier' }}
        </button>
      </div>
    </div>

    <!-- Mot de passe provisoire -->
    <div>
      <p class="field-label">Mot de passe provisoire</p>
      <div class="flex items-center gap-2">
        <code class="flex-1 rounded-md border border-border bg-muted px-3 py-2 text-sm font-mono break-all">{{ motDePasse }}</code>
        <button type="button" class="btn-outline btn-sm shrink-0" (click)="copier(motDePasse, 'mdp')">
          {{ copieMdp ? 'Copié ✓' : 'Copier' }}
        </button>
      </div>
    </div>

    <div class="flex justify-end pt-4 border-t border-border">
      <button type="button" class="btn-primary" (click)="fermer()">J'ai noté les identifiants</button>
    </div>
  </div>
</app-modal>
