<div class="fixed inset-0 z-[60] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-[2px] animate-fade-in"></div>

  <div class="relative w-full max-w-md animate-scale-in overflow-hidden rounded-xl border border-border bg-card shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="pw-reminder-title">
    <div class="border-b border-border bg-gradient-to-br from-primary/[0.08] to-violet-500/[0.06] px-6 py-4">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-warning/15 text-warning">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div>
          <h2 id="pw-reminder-title" class="text-base font-semibold text-foreground">Sécurité de votre compte</h2>
          <p class="text-xs text-muted-foreground">Mot de passe temporaire à modifier</p>
        </div>
      </div>
    </div>

    <div class="px-6 py-5">
      <p class="text-sm text-muted-foreground">
        Pour des raisons de sécurité, vous devez <strong class="text-foreground">changer votre mot de passe
        temporaire</strong> avant de continuer. Cette action est obligatoire.
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-4 space-y-3">
        <div>
          <label class="field-label">Mot de passe actuel (temporaire)</label>
          <input type="password" formControlName="currentPassword" class="input" placeholder="••••••••" />
        </div>
        <div>
          <label class="field-label">Nouveau mot de passe</label>
          <input type="password" formControlName="newPassword" class="input" placeholder="6 caractères minimum" />
        </div>
        <div>
          <label class="field-label">Confirmation</label>
          <input type="password" formControlName="confirmation" class="input" placeholder="Confirmez le mot de passe" />
          <p *ngIf="form.hasError('mismatch') && form.get('confirmation')?.touched" class="field-error">
            La confirmation ne correspond pas au nouveau mot de passe.
          </p>
        </div>

        <p *ngIf="error" class="alert-destructive">{{ error }}</p>

        <div class="flex items-center justify-between gap-3 pt-2">
          <button type="button" (click)="logout()" class="btn-ghost btn-sm">Se déconnecter</button>
          <button type="submit" [disabled]="saving" class="btn-primary btn-sm">
            {{ saving ? 'Modification…' : 'Changer le mot de passe' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
