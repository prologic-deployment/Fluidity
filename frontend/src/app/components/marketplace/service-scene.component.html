<!--
  Expérience cinématique plein écran : section haute + viewport collant.
  Le canvas couvre TOUT le fond ; les étapes de texte racontent le parcours
  du service au fil du scroll (synchronisées par GSAP ScrollTrigger).
-->
<!--
  IMPORTANT : pas d'overflow hidden sur la section — il casserait
  position:sticky du viewport collant (le parent devient un conteneur de
  défilement). Le clipping se fait sur le div sticky (h-screen overflow-hidden).
-->
<section
  #cinSection
  class="cinematic-section relative w-full"
  [class.cinematic-section--reduced]="reduced"
  [style.height]="sectionHeight"
  [attr.data-product-key]="productKey"
  [attr.data-scene-ready]="ready"
  [attr.aria-label]="(labelKey | t) || undefined"
  [attr.aria-busy]="!ready"
  role="region"
>
  <div
    class="w-full overflow-hidden"
    [ngClass]="reduced ? 'relative min-h-screen' : 'sticky top-0 h-screen'"
  >
    <!-- Canvas Three.js (plein écran, décoratif) -->
    <canvas
      #canvas
      class="pointer-events-none absolute inset-0 block h-full w-full"
      aria-hidden="true"
    ></canvas>

    <!-- Dégradés de lisibilité (ne bloquent pas les clics) -->
    <div
      class="pointer-events-none absolute inset-0 z-[1] bg-gradient-to-b from-background/75 via-background/15 to-background/75 dark:from-background/85 dark:via-background/20 dark:to-background/85"
      aria-hidden="true"
    ></div>
    <div
      class="pointer-events-none absolute inset-0 z-[1] bg-[radial-gradient(ellipse_at_center,transparent_25%,rgba(2,6,23,0.10)_100%)] dark:bg-[radial-gradient(ellipse_at_center,transparent_20%,rgba(2,6,23,0.42)_100%)]"
      aria-hidden="true"
    ></div>

    <!-- Étapes de texte du storytelling. Tant que le runtime n'est pas prêt,
         le conteneur reste masqué derrière l'état de préparation. -->
    <div
      #storyOverlay
      class="scene-overlay pointer-events-none absolute inset-0 z-10 transition-opacity duration-300"
      [class.hidden]="reduced"
      [class.invisible]="!ready"
      [class.opacity-0]="!ready"
      [class.opacity-100]="ready"
      [attr.aria-hidden]="reduced"
    >
      <div
        *ngFor="let stage of storyStages; let i = index"
        #stageEl
        class="story-stage absolute inset-0 flex items-center px-6 pb-24 sm:px-14 lg:px-24"
        [class.story-stage--first]="i === 0"
        [attr.data-step]="i"
        [ngClass]="stageClass(stage)"
      >
        <div
          class="w-full max-w-xl rounded-2xl border border-border/50 bg-background/45 p-6 shadow-xl shadow-black/10 backdrop-blur-md sm:p-8 dark:bg-background/50"
          [ngClass]="stageInnerClass(stage)"
        >
          <p
            *ngIf="stage.kickerKey"
            class="text-xs font-semibold uppercase tracking-[0.22em]"
            [style.color]="color"
          >
            {{ stage.kickerKey | t }}
          </p>
          <h2
            class="mt-3 text-3xl font-bold leading-tight tracking-tight text-foreground sm:text-4xl lg:text-5xl"
          >
            {{ stage.titleKey | t }}
          </h2>
          <p
            *ngIf="stage.textKey"
            class="mt-4 max-w-md text-base leading-relaxed text-foreground/85 sm:text-lg"
            [ngClass]="stage.align === 'center' ? 'mx-auto' : ''"
          >
            {{ stage.textKey | t }}
          </p>
          <a
            *ngIf="stage.cta && ctaRoute"
            [routerLink]="ctaRoute"
            class="btn-primary pointer-events-auto mt-7 inline-flex items-center gap-2 px-6 py-3 text-base"
          >
            {{ ctaLabelKey | t }}
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Mode mouvement réduit : aucun pinning long ni textes superposés.
         Tous les chapitres restent lisibles dans un flux HTML normal. -->
    <div
      *ngIf="reduced"
      class="relative z-10 mx-auto grid max-w-6xl gap-4 px-6 py-20 sm:grid-cols-2 lg:px-10"
    >
      <article
        *ngFor="let stage of storyStages; let i = index"
        class="rounded-2xl border border-border/60 bg-background/80 p-6 shadow-lg shadow-black/5 backdrop-blur-md"
        [attr.data-static-step]="i"
      >
        <p
          *ngIf="stage.kickerKey"
          class="text-xs font-semibold uppercase tracking-[0.2em]"
          [style.color]="color"
        >{{ stage.kickerKey | t }}</p>
        <h2 class="mt-2 text-2xl font-bold leading-tight text-foreground">
          {{ stage.titleKey | t }}
        </h2>
        <p *ngIf="stage.textKey" class="mt-3 text-sm leading-relaxed text-foreground/80">
          {{ stage.textKey | t }}
        </p>
        <a
          *ngIf="stage.cta && ctaRoute"
          [routerLink]="ctaRoute"
          class="btn-primary mt-5 inline-flex items-center gap-2"
        >{{ ctaLabelKey | t }} <span aria-hidden="true">→</span></a>
      </article>
    </div>

    <!-- Indicateur de scroll -->
    <div
      *ngIf="!reduced"
      class="pointer-events-none absolute bottom-6 left-1/2 z-10 -translate-x-1/2 text-center"
      aria-hidden="true"
    >
      <p class="text-[11px] font-medium uppercase tracking-widest text-muted-foreground">
        {{ 'marketplace.scrollHint' | t }}
      </p>
      <svg
        class="mx-auto mt-1.5 h-4 w-4 animate-bounce text-muted-foreground"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>

    <!-- Chargement -->
    <div
      *ngIf="!ready && !fallback"
      class="absolute inset-0 z-20 flex flex-col items-center justify-center gap-3 bg-background/70 backdrop-blur-[2px]"
      role="status"
      aria-live="polite"
    >
      <div class="h-8 w-8 animate-spin rounded-full border-2 border-border border-t-primary" aria-hidden="true"></div>
      <p class="text-sm font-medium text-muted-foreground">{{ 'scene.loading' | t }}</p>
    </div>

    <!-- Repli WebGL (animation CSS, jamais d'écran vide) -->
    <div
      *ngIf="fallback"
      class="pointer-events-none absolute inset-0 z-[2] flex flex-col items-center justify-center gap-5 overflow-hidden"
      aria-hidden="true"
    >
      <div class="fallback-orbit relative h-40 w-40">
        <span class="fallback-ring fallback-ring-1" [style.border-color]="color"></span>
        <span class="fallback-ring fallback-ring-2" [style.border-color]="color"></span>
        <span class="fallback-ring fallback-ring-3" [style.border-color]="color"></span>
        <span
          class="fallback-core absolute left-1/2 top-1/2 h-4 w-4 -translate-x-1/2 -translate-y-1/2 rounded-full"
          [style.background]="color"
        ></span>
      </div>
      <p class="max-w-xs text-center text-xs text-muted-foreground">
        {{ 'scene.fallback' | t }}
      </p>
    </div>
  </div>
</section>
