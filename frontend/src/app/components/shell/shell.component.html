<div class="flex h-screen w-full overflow-hidden bg-muted/30">

  <!-- Sidebar — desktop : toujours visible -->
  <div class="hidden shrink-0 lg:block">
    <app-sidebar></app-sidebar>
  </div>

  <!-- Sidebar — mobile/tablette : superposition avec fond assombri -->
  <div *ngIf="mobileMenuOpen" class="fixed inset-0 z-40 lg:hidden">
    <div
      class="absolute inset-0 animate-fade-in bg-slate-950/60 backdrop-blur-[2px]"
      (click)="closeMobileMenu()"
      aria-hidden="true"
    ></div>
    <div class="absolute inset-y-0 left-0 animate-slide-in-left shadow-2xl">
      <app-sidebar></app-sidebar>
    </div>
  </div>

  <!-- Colonne principale : topbar sticky + contenu de page -->
  <div class="flex min-w-0 flex-1 flex-col">
    <app-topbar [mobileMenuOpen]="mobileMenuOpen" (menuToggle)="toggleMobileMenu()"></app-topbar>
    <main class="flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
