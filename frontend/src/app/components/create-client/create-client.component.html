<div class="min-h-screen">
  <header class="border-b border-border bg-card/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-2xl mx-auto px-6 py-5">
      <a routerLink="/clients" class="btn-link">&larr; {{ 'clients.backTo' | t }}</a>
      <h1 class="text-xl font-semibold tracking-tight mt-1">{{ 'clients.new' | t }}</h1>
      <p class="text-sm text-muted-foreground">{{ 'clients.reservedAdmins' | t }}</p>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-8">
    <form [formGroup]="form" (ngSubmit)="submit()" class="card animate-fade-in-up">
      <div class="card-header-tinted">
        <div class="form-section-header">
          <div class="form-section-icon">
            <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
          <div>
            <h2 class="card-title">{{ 'clients.info' | t }}</h2>
            <p class="card-description">{{ 'clients.emailHint' | t }}</p>
          </div>
        </div>
      </div>

      <div class="card-content pt-6 space-y-5">
        <p *ngIf="error" class="alert-destructive">{{ error }}</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="field-label">{{ 'clients.name' | t }}</label>
            <input formControlName="nom" type="text" class="input" [attr.placeholder]="'clients.namePlaceholder' | t" />
            <p *ngIf="form.get('nom')?.invalid && form.get('nom')?.touched" class="field-error">{{ 'common.fieldRequired' | t }}</p>
          </div>
          <div>
            <label class="field-label">{{ 'clients.email' | t }}</label>
            <input formControlName="email" type="email" class="input" [attr.placeholder]="'clients.emailPlaceholder' | t" />
            <p *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="field-error">{{ 'clients.validEmail' | t }}</p>
          </div>
          <div>
            <label class="field-label">{{ 'clients.phone' | t }}</label>
            <input formControlName="telephone" type="text" class="input" />
          </div>
          <div>
            <label class="field-label">{{ 'clients.status' | t }}</label>
            <select formControlName="statut" class="select">
              <option *ngFor="let s of statuts" [value]="s">{{ s | tl }}</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="field-label">{{ 'clients.address' | t }}</label>
            <input formControlName="adresse" type="text" class="input" />
          </div>
        </div>

        <div>
          <label class="field-label">{{ 'clients.notes' | t }}</label>
          <textarea formControlName="notes" rows="3" class="textarea"></textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-border">
          <a routerLink="/clients" class="btn-outline">{{ 'common.cancel' | t }}</a>
          <button type="submit" [disabled]="loading" class="btn-primary">
            {{ loading ? ('common.creation' | t) + '...' : ('clients.createBtn' | t) }}
          </button>
        </div>
      </div>
    </form>

    <p class="mt-4 text-sm text-muted-foreground">
      {{ 'clients.portalHint' | t }}
    </p>
  </main>

  <app-credentials-modal
    [open]="!!identifiants"
    [email]="identifiants?.email || ''"
    [motDePasse]="identifiants?.motDePasseProvisoire || ''"
    contexte="creation"
    (closed)="fermerIdentifiants()"
  ></app-credentials-modal>
</div>
