<div class="min-h-screen">
  <header class="border-b border-border bg-card/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-2xl mx-auto px-6 py-5">
      <a routerLink="/plateforme/tenants" class="btn-link">&larr; Retour aux tenants</a>
      <h1 class="text-xl font-semibold tracking-tight mt-1">Nouveau tenant</h1>
      <p class="text-sm text-muted-foreground">Onboarde une nouvelle entreprise (ou un individu) sur la plateforme.</p>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-6 py-8">
    <form [formGroup]="form" (ngSubmit)="submit()" class="card animate-fade-in-up">
      <div class="card-header-tinted">
        <div class="form-section-header">
          <div class="form-section-icon">
            <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
          </div>
          <div>
            <h2 class="card-title">Informations du tenant</h2>
            <p class="card-description">Chaque tenant dispose de son propre espace isolé et de son administrateur.</p>
          </div>
        </div>
      </div>

      <div class="card-content pt-6 space-y-5">
        <p *ngIf="error" class="alert-destructive">{{ error }}</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="field-label">Nom de l'entreprise</label>
            <input formControlName="name" type="text" class="input" placeholder="ex: Acme Corp" />
            <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="field-error">Champ requis.</p>
          </div>
          <div>
            <label class="field-label">Identifiant (slug)</label>
            <input formControlName="slug" type="text" class="input" placeholder="généré automatiquement si vide" />
          </div>
          <div>
            <label class="field-label">Type</label>
            <select formControlName="type" class="select">
              <option *ngFor="let t of types" [value]="t">{{ t }}</option>
            </select>
          </div>
          <div>
            <label class="field-label">Email de contact</label>
            <input formControlName="email" type="email" class="input" />
            <p *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="field-error">Email valide requis.</p>
          </div>
          <div>
            <label class="field-label">Téléphone</label>
            <input formControlName="phone" type="text" class="input" />
          </div>
          <div>
            <label class="field-label">Site web</label>
            <input formControlName="website" type="text" class="input" />
          </div>
          <div class="md:col-span-2">
            <label class="field-label">Adresse</label>
            <input formControlName="address" type="text" class="input" />
          </div>
          <div>
            <label class="field-label">Plan</label>
            <select formControlName="plan" class="select">
              <option *ngFor="let p of plans" [value]="p">{{ p }}</option>
            </select>
          </div>
          <div>
            <label class="field-label">Licences (max. utilisateurs)</label>
            <input formControlName="maxUsers" type="number" min="1" class="input" />
            <p *ngIf="form.get('maxUsers')?.invalid && form.get('maxUsers')?.touched" class="field-error">Doit être au moins 1.</p>
          </div>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-border">
          <a routerLink="/plateforme/tenants" class="btn-outline">Annuler</a>
          <button type="submit" [disabled]="loading" class="btn-primary">
            {{ loading ? 'Création...' : 'Créer le tenant' }}
          </button>
        </div>
      </div>
    </form>
  </main>
</div>
