<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Fluidity - Portail de gestion des services Cloud</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Portail de gestion des services Cloud - Fluidity" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Applique le thème avant le rendu Angular pour éviter tout scintillement.
    (function () {
      try {
        var stored = localStorage.getItem('fluidity_theme');
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-background text-foreground font-sans">
  <app-root></app-root>
</body>
</html>
