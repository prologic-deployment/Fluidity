<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>ServiceDesk — Enterprise Service Portal</title>
  <base href="/" />
  <!-- Thème avant premier rendu : aucune « flash » clair/sombre au chargement -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('servicedesk_theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Fluidity — Plateforme SaaS multi-produits. Cloud ServiceDesk disponible ; Gestion de Projet, RH, CRM et plus bientôt." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Fluidity — Plateforme SaaS modulaire" />
  <meta property="og:description" content="Une plateforme SaaS. Les services dont votre organisation a besoin." />
  <meta property="og:site_name" content="Fluidity" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

</body>
</html>
